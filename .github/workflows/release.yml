name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and release Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_TELEMETRY: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.17'
          python-version: '3.12.10'
          enable-cache: false

      - name: Set the application version from the release tag
        run: uv run --no-project --python 3.12.10 python scripts/release.py --tag "$env:RELEASE_TAG" --prepare

      - name: Install locked application, GPU, and build dependencies
        run: uv sync --locked --python 3.12.10 --extra gpu --extra build

      - name: Check code style
        run: |
          & .venv/Scripts/ruff.exe check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/ruff.exe format --check .

      - name: Run tests
        run: .venv/Scripts/python.exe -m pytest -q

      - name: Build folder and standalone Windows apps with GPU libraries
        run: .venv/Scripts/python.exe -m PyInstaller --noconfirm VPNCounter.spec

      - name: Check both packaged apps without a microphone or GPU
        run: |
          $checks = @{
            './dist/VPNCounter/VPNCounter.exe' = 'artifacts/folder-smoke.json'
            './dist/VPNCounter-portable.exe' = 'artifacts/portable-smoke.json'
          }
          foreach ($check in $checks.GetEnumerator()) {
            $appProcess = Start-Process -FilePath $check.Key -ArgumentList @('--smoke-test', $check.Value) -PassThru -WindowStyle Hidden
            if (-not $appProcess.WaitForExit(180000)) { throw "Packaged application smoke check timed out: $($check.Key)" }
            if ($appProcess.ExitCode -ne 0) { throw "Packaged application failed its smoke check: $($check.Key)" }
            $report = Get-Content -LiteralPath $check.Value -Raw | ConvertFrom-Json
            if (-not $report.ok) { throw 'Packaged application reported a failed smoke check.' }
            if ($report.version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Packaged application version does not match the release tag.' }
          }

      - name: Create versioned ZIP, portable EXE, and SHA-256 checksums
        run: .venv/Scripts/python.exe scripts/release.py --tag "$env:RELEASE_TAG"

      - name: Verify both downloads and publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          & .venv/Scripts/python.exe scripts/release.py --tag "$env:RELEASE_TAG" --verify-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archivePath = Join-Path (Get-Location) "artifacts/releases/VPNCounter-${env:RELEASE_TAG}-windows-x64.zip"
          $executablePath = Join-Path (Get-Location) "artifacts/releases/VPNCounter-${env:RELEASE_TAG}-windows-x64.exe"
          $checksumPath = Join-Path (Get-Location) 'artifacts/releases/SHA256SUMS.txt'
          gh release create "$env:RELEASE_TAG" $executablePath $archivePath $checksumPath --repo "$env:GH_REPO" --verify-tag --generate-notes --notes-file docs/release-notes.md --title "VPN Counter $env:RELEASE_TAG"
