[project]
name = "vpn-counter"
version = "0.1.1"
description = "An offline Hungarian speech counter with a PowerPoint overlay."
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "faster-whisper>=1.2.1,<2",
  "av>=14,<17",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12>=12.8,<13; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.8,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
build = ["pyinstaller>=6.12,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vpn-counter = "vpn_counter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
